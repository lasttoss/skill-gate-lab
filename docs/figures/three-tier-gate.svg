<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="three-tier-gate-root" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">A skill passes three tiers of checks, each cheaper than the next, and tier 3 records one row per step</title>
  <desc id="d">Left to right: the catalog, then tier 1 structure, tier 2 routing and wiring, tier 3 behaviour, then the step log and report. Tier 1 and tier 2 are free and run on every commit; tier 3 spends tokens and runs only on workflows that passed the free tiers. Below the flow, one real failed step row shows the shape of the evidence.</desc>
  <defs>
      <style>#three-tier-gate-root { --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399;
    --rule:rgba(45,49,66,0.12); --rule-solid:#bfc0c0; --accent:#eb6c36;
    --accent-tint:rgba(235,108,54,0.08); }
      #three-tier-gate-root { font-family: Inter,system-ui,-apple-system,"Segoe UI",sans-serif; color: var(--ink); }
      #three-tier-gate-root figure { margin:0;max-width:1040px; }
      #three-tier-gate-root figcaption { margin-top:18px;font-size:13px;line-height:1.55;color:var(--muted);max-width:84ch; }
      #three-tier-gate-root .mono { font-family:ui-monospace,"SF Mono",Menlo,monospace; }</style>
  </defs>

  <rect x="0" y="0" width="960" height="520" fill="var(--paper)"/>

  <!-- header -->
  <text x="24" y="30" font-size="11.5" letter-spacing="0.09em" fill="var(--soft)" class="mono">WHAT RUNS</text>
  <text x="24" y="48" font-size="12.5" fill="var(--muted)">a skill the team wrote, on its way to being trusted</text>
  <line x1="24" y1="60" x2="936" y2="60" stroke="var(--rule)" stroke-width="1"/>

  <!-- stage 1: catalog -->
  <g>
    <rect x="24" y="80" width="150" height="78" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="40" y="104" font-size="12" font-weight="600" class="mono">catalog/</text>
    <text x="40" y="123" font-size="11" fill="var(--muted)">5 SKILL.md</text>
    <text x="40" y="140" font-size="10.5" fill="var(--soft)">written by the team</text>
  </g>
  <text x="24" y="176" font-size="10.5" fill="var(--soft)" class="mono">owner: the team</text>

  <!-- arrow 1 -->
  <line x1="178" y1="119" x2="204" y2="119" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="210,119 200,114 200,124" fill="var(--muted)"/>

  <!-- stage 2: tier 1 -->
  <g>
    <rect x="214" y="80" width="150" height="78" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="230" y="104" font-size="12" font-weight="600" class="mono">tier 1 · structure</text>
    <text x="230" y="123" font-size="11" fill="var(--muted)">frontmatter, sections,</text>
    <text x="230" y="139" font-size="11" fill="var(--muted)">line budget, version</text>
  </g>
  <text x="214" y="176" font-size="10.5" class="mono" fill="var(--muted)">free · 0.03 s</text>
  <text x="214" y="192" font-size="10.5" fill="var(--soft)">every commit</text>

  <line x1="368" y1="119" x2="394" y2="119" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="400,119 390,114 390,124" fill="var(--muted)"/>

  <!-- stage 3: tier 2 -->
  <g>
    <rect x="404" y="80" width="150" height="78" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="420" y="104" font-size="12" font-weight="600" class="mono">tier 2 · routing</text>
    <text x="420" y="123" font-size="11" fill="var(--muted)">does the description</text>
    <text x="420" y="139" font-size="11" fill="var(--muted)">carry the user's words</text>
  </g>
  <text x="404" y="176" font-size="10.5" class="mono" fill="var(--muted)">free · rank-1 100%</text>
  <text x="404" y="192" font-size="10.5" fill="var(--soft)">floor 100% — a drop turns CI red</text>

  <line x1="558" y1="119" x2="584" y2="119" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="590,119 580,114 580,124" fill="var(--muted)"/>

  <!-- stage 4: tier 3, focal -->
  <g>
    <rect x="594" y="80" width="160" height="78" rx="3" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.4"/>
    <text x="610" y="104" font-size="12" font-weight="600" class="mono" fill="var(--accent)">tier 3 · behaviour</text>
    <text x="610" y="123" font-size="11" fill="var(--muted)">the workflow runs,</text>
    <text x="610" y="139" font-size="11" fill="var(--muted)">step by step</text>
  </g>
  <text x="594" y="176" font-size="10.5" class="mono" fill="var(--muted)">costs tokens · 88.9%</text>
  <text x="594" y="192" font-size="10.5" fill="var(--soft)">only runs what passed tier 1+2</text>

  <line x1="758" y1="119" x2="784" y2="119" stroke="var(--muted)" stroke-width="1.4"/>
  <polygon points="790,119 780,114 780,124" fill="var(--muted)"/>

  <!-- stage 5: evidence -->
  <g>
    <rect x="794" y="80" width="142" height="78" rx="3" fill="var(--paper-2)" stroke="var(--rule-solid)"/>
    <text x="810" y="104" font-size="12" font-weight="600" class="mono">steps.jsonl</text>
    <text x="810" y="123" font-size="11" fill="var(--muted)">one row per step</text>
    <text x="810" y="139" font-size="11" fill="var(--muted)">→ report.html</text>
  </g>
  <text x="794" y="176" font-size="10.5" class="mono" fill="var(--muted)">18 rows · $0.001524</text>
  <text x="794" y="192" font-size="10.5" fill="var(--soft)">p50 99 · p95 198 ms</text>

  <!-- what each tier catches -->
  <line x1="24" y1="216" x2="936" y2="216" stroke="var(--rule)" stroke-width="1"/>
  <text x="24" y="238" font-size="11.5" letter-spacing="0.09em" fill="var(--soft)" class="mono">WHAT IT CATCHES</text>

  <text x="214" y="238" font-size="11" fill="var(--muted)">no stop condition,</text>
  <text x="214" y="253" font-size="11" fill="var(--muted)">no failure modes</text>

  <text x="404" y="238" font-size="11" fill="var(--muted)">a description missing</text>
  <text x="404" y="253" font-size="11" fill="var(--muted)">what users actually say;</text>
  <text x="404" y="268" font-size="11" fill="var(--muted)">two steps writing</text>
  <text x="404" y="283" font-size="11" fill="var(--muted)">the same artifact</text>

  <text x="594" y="238" font-size="11" fill="var(--muted)">a step that fails</text>
  <text x="594" y="253" font-size="11" fill="var(--muted)">only when it runs,</text>
  <text x="594" y="268" font-size="11" fill="var(--muted)">and its price</text>

  <!-- funnel rule: fills the right of the band with the figure's thesis, not decoration -->
  <text x="700" y="238" font-size="10.5" letter-spacing="0.08em" fill="var(--soft)" class="mono">THE FUNNEL RULE</text>
  <text x="700" y="258" font-size="11" fill="var(--muted)">a stage only sees what the</text>
  <text x="700" y="273" font-size="11" fill="var(--muted)">stage before it passed</text>

  <!-- inset: one real failed row -->
  <g>
    <rect x="24" y="304" width="912" height="184" rx="3" fill="#ffffff" stroke="var(--rule-solid)"/>
    <text x="44" y="330" font-size="11.5" letter-spacing="0.09em" fill="var(--soft)" class="mono">ONE REAL FAILED STEP — NOT A SUMMARY</text>

    <text x="44" y="362" font-size="11.5" class="mono" fill="var(--muted)">input</text>
    <text x="140" y="362" font-size="11.5" class="mono">bug-huge-log</text>
    <text x="300" y="362" font-size="11.5" class="mono" fill="var(--muted)">step</text>
    <text x="348" y="362" font-size="11.5" class="mono">reproduce</text>
    <text x="470" y="362" font-size="11.5" class="mono" fill="var(--muted)">skill</text>
    <text x="516" y="362" font-size="11.5" class="mono">test-first</text>
    <text x="640" y="362" font-size="11.5" class="mono" fill="var(--muted)">status</text>
    <text x="700" y="362" font-size="11.5" class="mono" fill="var(--accent)">failed</text>

    <text x="44" y="392" font-size="11.5" class="mono" fill="var(--muted)">reason_codes</text>
    <text x="140" y="392" font-size="11.5" class="mono" fill="var(--accent)">budget_exceeded</text>
    <text x="300" y="392" font-size="11.5" class="mono" fill="var(--accent)">assert_failed</text>

    <text x="44" y="422" font-size="11.5" class="mono" fill="var(--muted)">tokens / cost / latency</text>
    <text x="220" y="422" font-size="11.5" class="mono">831 in · 2 out — over the 400 budget</text>
    <text x="520" y="422" font-size="11.5" class="mono">$0.000126</text>
    <text x="650" y="422" font-size="11.5" class="mono">125 ms</text>

    <line x1="44" y1="440" x2="916" y2="440" stroke="var(--rule)" stroke-width="1"/>
    <text x="44" y="462" font-size="11.5" fill="var(--muted)">A workflow scored 82% can be three broken steps and five perfect ones.</text>
    <text x="44" y="478" font-size="11.5" fill="var(--muted)">One row per step is what makes the score actionable; eight closed reason codes are what make it countable.</text>
  </g>
</svg>
