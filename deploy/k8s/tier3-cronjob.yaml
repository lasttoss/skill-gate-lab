# Tier 3 on a schedule. Costs tokens, so it runs weekly and only against workflows
# that already passed the free tiers in the same cluster.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: skill-gate-paid
  labels:
    app.kubernetes.io/name: skill-gate-lab
spec:
  schedule: "0 2 * * 1"          # Monday 02:00 UTC = 09:00 VN
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: run
              image: ghcr.io/lasttoss/skill-gate-lab:0.1.0
              args:
                - run
                - --workflow=coding-flow
                - --runs=3
                - --executor-cmd=sh -c 'model-cli --stdin'
              env:
                - name: MODEL_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: model-credentials
                      key: api-key
                      optional: true
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "1", memory: 512Mi}
