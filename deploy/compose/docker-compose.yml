# Two services, because the two cost tiers have two different owners:
#   gate   — free, deterministic, safe to run on every commit
#   run    — spends money against a real model; profiles gate it off by default
#
# The container runs as the invoking host uid, or the report it writes into the
# bind-mounted out/ lands root-owned and the next local run fails on permissions.
#
#   docker compose -f deploy/compose/docker-compose.yml run --rm gate
#   docker compose -f deploy/compose/docker-compose.yml --profile paid run --rm run
services:
  gate:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["gate"]
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ../../out:/app/out
    restart: "no"

  smoke:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["smoke"]
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ../../out:/app/out
    restart: "no"

  run:
    build:
      context: ../..
      dockerfile: Dockerfile
    # The executor is a shell command, so any provider CLI fits without changing
    # the image. In CI the key comes from a secret, never from the image.
    command: ["run", "--workflow", "coding-flow", "--runs", "3", "--executor-cmd", "${EXECUTOR_CMD:-cat}"]
    environment:
      - MODEL_API_KEY=${MODEL_API_KEY:-}
    volumes:
      - ../../out:/app/out
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    profiles: ["paid"]
    restart: "no"
